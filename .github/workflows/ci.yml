name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: mapsql_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MAPSQL_TEST_DATABASE_URL: postgresql://postgres:pw@localhost:5432/mapsql_test
      MAPSQL_DEMO_URL: postgresql://postgres:pw@localhost:5432/mapsql_demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,oracle]"
      # Oracle tests that need a database skip themselves without credentials; the Oracle SQL guard tests always run
      - run: pytest -q
      - name: Benchmark gold answers and toolset coverage (offline demo snapshot)
        run: |
          PGPASSWORD=pw psql -h localhost -U postgres -c "CREATE DATABASE mapsql_demo"
          python demo/build_demo_db.py
          python bench/run_bench.py --validate-gold
          python bench/run_bench.py --oracle
